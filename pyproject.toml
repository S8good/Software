[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanosense"
version = "0.1.0"
description = "Desktop spectroscopy acquisition and analysis software"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "PyQt5==5.15.10",
    "pyqtgraph==0.12.4",
    "numpy==1.26.4",
    "scipy==1.10.1",
    "pandas==1.3.5",
    "matplotlib==3.5.3",
    "colour-science==0.4.4",
    "imageio==2.37.0",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "reportlab==4.4.5",
    "pythonnet==3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-qt==4.4.0",
    "pytest-cov==5.0.0",
]

[project.scripts]
nanosense = "main:main"
nanosense-import-spectra = "scripts.import_spectra:main"
nanosense-generate-demo-database = "scripts.generate_demo_database:main"

[tool.setuptools]
include-package-data = true
py-modules = [
    "main",
    "main_acquisition_loop",
    "mock_spectrometer_api",
    "ocean_direct_api",
]

[tool.setuptools.packages.find]
include = ["nanosense*", "scripts*"]

[tool.setuptools.package-data]
nanosense = [
    "gui/assets/*",
    "gui/assets/icons/*",
    "translations/*.qm",
    "translations/*.ts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
